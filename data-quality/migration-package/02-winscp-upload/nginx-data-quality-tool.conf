# Nginx site for the Data Quality Tool (the Capacity Plan is embedded in it).
#
# Install:
#   Debian / Ubuntu
#     sudo cp nginx-data-quality-tool.conf /etc/nginx/sites-available/data-quality-tool
#     sudo ln -s /etc/nginx/sites-available/data-quality-tool /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default        # the default site shadows this one
#   RHEL / CentOS / Rocky / Alma
#     sudo cp nginx-data-quality-tool.conf /etc/nginx/conf.d/data-quality-tool.conf
#
# Apply:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nginx returns 502 when it cannot get a reply from the Node app. Every directive
# below that exists to prevent one says so. See README-PuTTY.txt for how to tell
# the causes apart.

upstream data_quality_tool {
    # Must match PORT in .env.local (default 3000). A mismatch here is the single
    # most common cause of 502: Nginx is fine, the app is fine, they are just not
    # pointed at each other.
    server 127.0.0.1:3000;

    # Reuse connections instead of opening one per request. Needs the two
    # proxy_http_version / Connection lines below to work.
    keepalive 32;
}

server {
    listen 80;
    server_name _;              # replace _ with the real hostname if you have one

    # Excel and CSV uploads. Nginx allows 1 MB by default, which rejects real
    # workbooks with 413 before the app ever sees them.
    client_max_body_size 25m;

    # Validation runs and report exports on large files take longer than the 60s
    # default, which would cut them off with 504.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://data_quality_tool;

        # Keepalive to the upstream requires HTTP/1.1 and an empty Connection
        # header. Without these, Nginx sends "Connection: close" on a keepalive
        # pool and connection reuse fails intermittently — 502s that come and go.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # The Capacity audit trail records the client IP from this header. Leave it
        # out and every audited action looks like it came from the server itself.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Lets the app know the browser used HTTPS even though this hop is HTTP.
        # Pair with COOKIE_SECURE=true in .env.local when you terminate TLS here.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Response headers larger than the 4k default make Nginx fail the request
        # with "upstream sent too big header" — reported as 502 while the app is
        # perfectly healthy. Session cookies plus Next.js headers can reach that.
        proxy_buffer_size       16k;
        proxy_buffers        8  16k;
        proxy_busy_buffers_size 32k;
    }
}
